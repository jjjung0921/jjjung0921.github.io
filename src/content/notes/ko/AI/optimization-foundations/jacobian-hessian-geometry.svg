<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Jacobian과 Hessian의 기하학적 의미</title>
  <desc id="d">왼쪽: Jacobian J는 입력의 작은 원을 출력의 타원으로 보내고, 기저 방향 e1, e2를 J의 두 열 벡터로 보낸다. 넓이는 |det J|배가 된다. 오른쪽: Hessian의 고유값이 4와 1인 이차함수의 등고선. 고유벡터 방향이 타원의 축이고, 곡률이 큰 q1 방향의 반지름이 짧다(1/√λ).</desc>
