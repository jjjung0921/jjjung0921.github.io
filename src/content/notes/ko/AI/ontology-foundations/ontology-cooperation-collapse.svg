<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">협력 판정 규칙의 정의역·공역·치역과 역방향의 모호함</title>
  <desc id="d">왼쪽 정의역은 세계 상태 ①②③, 오른쪽 공역은 가능한 extension들이다. 협력 판정 규칙은 ①을 {(a,b),(b,a)}로, ②와 ③을 모두 공집합으로 보낸다. 치역은 {(a,b),(b,a)}와 공집합이고 {(a,c)}는 공역에 있지만 치역 밖이다. 공집합에서 거꾸로 돌아가면 ②인지 ③인지 알 수 없어 물음표로 표시했다.</desc>
  <style>
    text { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #1a1a18; font-size: 12px; }
    .h { font-size: 14px; font-weight: 500; } .big { font-size: 16px; font-weight: 500; } .q { font-size: 18px; font-weight: 500; fill: #534AB7; }
    .el { fill: none; stroke: #1a1a18; stroke-width: 1.2; }
    .rg { fill: none; stroke: #534AB7; stroke-width: 1.2; }
    .fw { fill: none; stroke: #D85A30; stroke-width: 1.5; }
    .bw { fill: none; stroke: #534AB7; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .hf { fill: #D85A30; } .hb { fill: #534AB7; }
    .lead { stroke: #534AB7; stroke-width: 0.8; } .rgt { fill: #534AB7; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f4f1ea; } .q { fill: #AFA9EC; } .el { stroke: #f4f1ea; }
      .rg, .bw, .lead { stroke: #AFA9EC; } .rgt { fill: #AFA9EC; } .fw { stroke: #F0997B; }
      .hf { fill: #F0997B; } .hb { fill: #AFA9EC; }
    }
  </style>
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hf" d="M0 1 L10 5 L0 9 z"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hb" d="M0 1 L10 5 L0 9 z"/></marker>
  </defs>
  <text class="h" x="345" y="30" text-anchor="middle">협력 판정 규칙 ρ: 같은 목표를 선언하고 둘 다 행동하면 협력</text>
  <ellipse class="el" cx="180" cy="200" rx="80" ry="150"/>
  <ellipse class="el" cx="510" cy="200" rx="110" ry="150"/>
  <ellipse class="rg" cx="510" cy="160" rx="90" ry="95"/>
  <text class="big" x="180" y="100" text-anchor="middle">①</text>
  <text class="big" x="180" y="175" text-anchor="middle">②</text>
  <text class="big" x="180" y="255" text-anchor="middle">③</text>
  <text class="h" x="510" y="114" text-anchor="middle">{(a,b), (b,a)}</text>
  <text class="big" x="510" y="210" text-anchor="middle">∅</text>
  <text class="h" x="510" y="310" text-anchor="middle">{(a,c)}</text>
  <line class="fw" x1="198" y1="96" x2="462" y2="109" marker-end="url(#af)"/>
  <line class="fw" x1="198" y1="171" x2="494" y2="201" marker-end="url(#af)"/>
  <line class="fw" x1="198" y1="251" x2="494" y2="209" marker-end="url(#af)"/>
  <path class="bw" d="M492 192 Q 350 136 204 162" marker-end="url(#ab)"/>
  <path class="bw" d="M492 216 Q 350 280 204 258" marker-end="url(#ab)"/>
  <text class="q" x="350" y="146" text-anchor="middle">?</text>
  <text class="q" x="350" y="288" text-anchor="middle">?</text>
  <line class="lead" x1="597" y1="128" x2="618" y2="108"/>
  <text class="rgt" x="622" y="104">치역</text>
  <text x="180" y="375" text-anchor="middle">정의역 W (세계 상태)</text>
  <text x="510" y="375" text-anchor="middle">공역 2^(D²) (가능한 extension)</text>
  <text x="60" y="412">① a와 b가 같은 목표를 선언하고 둘 다 행동한다</text>
  <text x="60" y="432">② a와 b가 같은 목표를 선언했지만 b는 행동하지 않는다</text>
  <text x="60" y="452">③ a와 b의 목표가 다르다</text>
  <text x="60" y="476">점선: extension에서 세계로 되돌아가기. ∅만 보고는 ②였는지 ③이었는지 알 수 없다</text>
</svg>
