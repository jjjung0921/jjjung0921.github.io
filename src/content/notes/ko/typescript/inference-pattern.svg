<svg viewBox="0 0 620 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Pretendard', system-ui, -apple-system, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #374151; }
    .code { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 12px; fill: #1F2937; }
    .label { font-size: 11.5px; fill: #6B7280; }
    .result { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; font-weight: 700; }
    .arrow { stroke: #9CA3AF; stroke-width: 1.5; fill: none; marker-end: url(#arrowDown); }
    .divider { stroke: #E5E7EB; stroke-width: 1; stroke-dasharray: 4 3; }

    @media (prefers-color-scheme: dark) {
      .title { fill: #D1D5DB; }
      .code { fill: #E5E7EB; }
      .label { fill: #9CA3AF; }
      .divider { stroke: #374151; }
    }
  </style>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Divider -->
  <line class="divider" x1="310" y1="15" x2="310" y2="265"/>

  <!-- Left panel: xs: T[] -->
  <text class="title" x="155" y="28" text-anchor="middle">xs: T[]</text>

  <!-- Input box: (Cat | Dog)[] -->
  <rect x="40" y="44" width="230" height="100" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <text class="code" x="155" y="62" text-anchor="middle">(Cat | Dog)[]</text>

  <!-- Inner box: T highlighted -->
  <rect x="65" y="72" width="180" height="52" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text class="code" x="155" y="93" text-anchor="middle" fill="#2563EB">Cat | Dog</text>
  <text class="result" x="155" y="113" text-anchor="middle" fill="#2563EB">= T</text>

  <!-- Outer label -->
  <text class="label" x="255" y="140" fill="#9CA3AF">[]</text>

  <!-- Arrow -->
  <line class="arrow" x1="155" y1="154" x2="155" y2="195"/>
  <text class="label" x="155" y="175" text-anchor="middle">[]를 벗긴다</text>

  <!-- Result -->
  <text class="result" x="155" y="220" text-anchor="middle" fill="#2563EB">T = Cat | Dog</text>
  <text class="label" x="155" y="248" text-anchor="middle">원소 타입을 꺼냈다</text>

  <!-- Right panel: xs: T -->
  <text class="title" x="465" y="28" text-anchor="middle">xs: T</text>

  <!-- Single box: T = whole thing -->
  <rect x="350" y="44" width="230" height="100" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text class="code" x="465" y="82" text-anchor="middle" fill="#2563EB">(Cat | Dog)[]</text>
  <text class="result" x="465" y="106" text-anchor="middle" fill="#2563EB">= T</text>

  <!-- Arrow -->
  <line class="arrow" x1="465" y1="154" x2="465" y2="195"/>
  <text class="label" x="465" y="175" text-anchor="middle">그대로</text>

  <!-- Result -->
  <text class="result" x="465" y="220" text-anchor="middle" fill="#2563EB">T = (Cat | Dog)[]</text>
  <text class="label" x="465" y="248" text-anchor="middle">통째로 받았다</text>

  <style>
    @media (prefers-color-scheme: dark) {
      rect[fill="#F3F4F6"] { fill: #1F2937; stroke: #4B5563; }
      rect[fill="#DBEAFE"] { fill: #1E3A5F; }
      .result[fill="#2563EB"] { fill: #60A5FA; }
      .code[fill="#2563EB"] { fill: #60A5FA; }
    }
  </style>
</svg>
