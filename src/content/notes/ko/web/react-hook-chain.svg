<svg viewBox="0 0 660 258" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Pretendard', system-ui, -apple-system, sans-serif; }
    .mono   { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .box-t  { font-size: 10px; font-weight: 700; fill: #1F2937; }
    .fld    { font-size: 8.5px; fill: #6B7280; }
    .fld-hi { font-size: 8.5px; font-weight: 700; fill: #2563EB; }
    .hk-t   { font-size: 9.5px; font-weight: 700; fill: #1F2937; }
    .hk-s   { font-size: 8px; fill: #6B7280; }
    .num    { font-size: 9px; font-weight: 700; fill: #FFFFFF; }
    .cut    { font-size: 9px; font-weight: 700; fill: #C0392B; }
    .note   { font-size: 9px; fill: #9CA3AF; }

    .fiber  { fill: #EEF5FD; stroke: #3E7DBF; stroke-width: 2; }
    .hook   { fill: #FFFFFF; stroke: #C7CDD4; stroke-width: 1.4; }
    .badge  { fill: #3E7DBF; }
    .arrow  { stroke: #7C93A8; stroke-width: 1.5; fill: none; }
    .scis   { stroke: #C0392B; stroke-width: 2.2; }

    @media (prefers-color-scheme: dark) {
      .box-t { fill: #E5E7EB; } .hk-t { fill: #E5E7EB; }
      .fld { fill: #9CA3AF; } .hk-s { fill: #9CA3AF; } .note { fill: #6B7280; }
      .fld-hi { fill: #60A5FA; }
      .fiber { fill: #172554; stroke: #3E7DBF; }
      .hook  { fill: #1F2937; stroke: #4B5563; }
      .arrow { stroke: #6B7280; }
      .cut { fill: #F87171; } .scis { stroke: #F87171; }
    }
  </style>

  <defs>
    <marker id="a2" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#7C93A8"/>
    </marker>
  </defs>

  <!-- Fiber -->
  <rect class="fiber" x="22" y="46" width="176" height="118" rx="7"/>
  <text class="box-t" x="36" y="68">Fiber — Counter 인스턴스</text>
  <text class="fld mono" x="36" y="88">tag: FunctionComponent</text>
  <text class="fld mono" x="36" y="103">type: Counter</text>
  <text class="fld-hi mono" x="36" y="120">memoizedState ────▶</text>
  <text class="fld mono" x="36" y="137">return · child · sibling</text>
  <text class="fld mono" x="36" y="152">alternate</text>

  <!-- fiber -> hook1 -->
  <line class="arrow" x1="198" y1="116" x2="246" y2="116" marker-end="url(#a2)"/>

  <!-- 절단 표시 -->
  <line class="scis" x1="216" y1="104" x2="230" y2="128"/>
  <line class="scis" x1="230" y1="104" x2="216" y2="128"/>
  <text class="cut" x="204" y="98">언마운트</text>

  <!-- Hook 1 -->
  <rect class="hook" x="248" y="74" width="112" height="84" rx="6"/>
  <circle class="badge" cx="262" cy="88" r="9"/>
  <text class="num" x="262" y="91" text-anchor="middle">1</text>
  <text class="hk-t" x="278" y="92">useState(0)</text>
  <text class="hk-s mono" x="258" y="115">memoizedState:</text>
  <text class="hk-s mono" x="258" y="128">  0</text>
  <text class="hk-s mono" x="258" y="146">next ──▶</text>

  <line class="arrow" x1="360" y1="116" x2="386" y2="116" marker-end="url(#a2)"/>

  <!-- Hook 2 -->
  <rect class="hook" x="388" y="74" width="112" height="84" rx="6"/>
  <circle class="badge" cx="402" cy="88" r="9"/>
  <text class="num" x="402" y="91" text-anchor="middle">2</text>
  <text class="hk-t" x="418" y="92">useEffect</text>
  <text class="hk-s mono" x="398" y="115">memoizedState:</text>
  <text class="hk-s mono" x="398" y="128">  Effect</text>
  <text class="hk-s mono" x="398" y="146">next ──▶</text>

  <line class="arrow" x1="500" y1="116" x2="526" y2="116" marker-end="url(#a2)"/>

  <!-- Hook 3 -->
  <rect class="hook" x="528" y="74" width="112" height="84" rx="6"/>
  <circle class="badge" cx="542" cy="88" r="9"/>
  <text class="num" x="542" y="91" text-anchor="middle">3</text>
  <text class="hk-t" x="558" y="92">useMemo</text>
  <text class="hk-s mono" x="538" y="115">memoizedState:</text>
  <text class="hk-s mono" x="538" y="128">  [값, deps]</text>
  <text class="hk-s mono" x="538" y="146">next: null</text>

  <!-- 주석 -->
  <text class="note" x="248" y="180">훅은 이름이 아니라 이 리스트의 순서로 찾는다 — 조건부 호출이 금지되는 이유</text>
  <text class="cut" x="22" y="200">화살표 하나가 끊기면 체인 전체가 함께 GC 대상이 된다.</text>
  <text class="note" x="22" y="216">"컴포넌트가 사라지면 상태도 사라진다"의 정체가 이것이다. 특별한 정리 절차가 아니라 참조 소실이다.</text>
  <text class="note" x="22" y="238">반면 QueryCache는 QueryClient가 붙들고 있어 이 화살표와 무관하다 — 그래서 언마운트를 견딘다.</text>
</svg>
