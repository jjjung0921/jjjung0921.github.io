name: 기능 · 콘텐츠 제안
description: 새 기능이나 콘텐츠(notes / projects / lab / cv) 추가·개선을 제안하세요
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: type
    attributes:
      label: 유형
      options:
        - 기능
        - 콘텐츠 추가 / 수정
        - 디자인 / 토큰
        - 리팩터
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 배경 · 문제
      description: 왜 필요한가요? (리뷰어 동선·사이트 목표 관점에서)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 어떻게 해결할지, 대안이 있다면 함께 적어주세요.
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: 확인
      options:
        - label: 콘텐츠 변경이면 ko/en 양쪽을 함께 반영한다
        - label: 토큰 변경이면 라이트/다크 값을 모두 정의한다
